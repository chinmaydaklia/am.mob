<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="referrer" content="no-referrer">
<title>Arihant Medicos — Phone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root { --navy: #1F3864; --blue: #1A4A7A; --green: #1E7B45; --red: #C0392B; --amber: #B7770D; --bg: #EEF1F5; --card: #fff; --text: #1d2433; --muted: #667085; --border: #E2E8F0; --alt: #F7F9FD; font-size: 14px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", Arial, sans-serif; }
a { color: var(--blue); text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
.top { position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff; padding: 8px 12px calc(8px); display: flex; align-items: center; gap: 8px; }
.top h1 { font-size: 15px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top button { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 6px; padding: 5px 9px; }
.asof { background: #FFF8E1; border-bottom: 1px solid #F0D58C; color: #6b4a00; padding: 6px 12px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.asof b { font-size: 13.5px; }
.asof.old { background: #FDECEA; color: #8a1f14; border-color: #F3B8B1; }
main { padding: 10px 10px 80px; max-width: 900px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid #E3E8EF; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 600px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: #fff; border: 1px solid #E3E8EF; border-left: 3px solid var(--navy); border-radius: 6px; padding: 7px 9px; }
.kpi .l { font-size: 11px; color: var(--muted); } .kpi .v { font-size: 17px; font-weight: 700; margin-top: 2px; } .kpi .s { font-size: 11px; color: var(--muted); }
.kpi.g { border-left-color: var(--green); } .kpi.r { border-left-color: var(--red); } .kpi.a { border-left-color: var(--amber); }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--border); align-items: center; }
.row:last-child { border-bottom: 0; }
.row .m { flex: 1; min-width: 0; } .row .m b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row small, .muted { color: var(--muted); font-size: 12px; } .row .r { text-align: right; white-space: nowrap; }
.list a.row { color: inherit; }
.red { color: var(--red); } .green { color: var(--green); } .amber { color: var(--amber); }
.tag { display: inline-block; padding: 1px 6px; border-radius: 99px; font-size: 11px; font-weight: 600; background: #EEF1F6; color: #344054; }
.tag.r { background: #FDECEA; color: var(--red); } .tag.g { background: #E7F6EC; color: var(--green); } .tag.a { background: #FFF5DB; color: var(--amber); } .tag.b { background: #E6F0FB; color: var(--blue); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.filters input, .filters select { border: 1px solid #CBD5E1; border-radius: 6px; padding: 7px 8px; background: #fff; min-width: 0; flex: 1 1 120px; font-size: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { border: 1px solid var(--border); background: #fff; border-radius: 99px; padding: 5px 11px; font-size: 13px; }
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 6px; padding: 8px 14px; font-weight: 600; background: var(--navy); color: #fff; cursor: pointer; }
.btn.ghost { background: #fff; color: var(--navy); border-color: var(--border); } .btn.wa { background: #25D366; } .btn.green { background: var(--green); } .btn.block { width: 100%; } .btn.sm { padding: 5px 10px; font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 5px 4px; border-bottom: 1px solid var(--border); }
td { padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tfoot td { font-weight: 700; background: #FFF8DC; }
.tw { overflow-x: auto; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 10; padding-bottom: env(safe-area-inset-bottom); }
.nav a { flex: 1; text-align: center; padding: 6px 0 7px; font-size: 11px; color: var(--muted); }
.nav a .i { display: block; font-size: 19px; } .nav a.on { color: var(--navy); font-weight: 700; }
.center { max-width: 420px; margin: 40px auto; }
.fg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.fg label { font-size: 12px; font-weight: 600; color: var(--muted); }
.fg input { border: 1px solid #CBD5E1; border-radius: 6px; padding: 9px 10px; font-size: 16px; }
.alert { padding: 8px 10px; border-radius: 6px; background: #FFF5DB; color: #6b4a00; font-size: 13px; margin-bottom: 8px; }
.alert.r { background: #FDECEA; color: #8a1f14; } .alert.g { background: #E7F6EC; color: #0f5130; } .alert.b { background: #E6F0FB; color: var(--navy); }
.menu a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--border); color: var(--text); }
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 8px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 7px 10px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs button.on { color: var(--navy); border-bottom-color: var(--navy); }
.spin { padding: 30px; text-align: center; color: var(--muted); }
.big { font-size: 22px; font-weight: 700; }
.hidden { display: none !important; }
.more { text-align: center; margin: 8px 0; }
</style>
</head>
<body>
<div id="app"><div class="spin">Loading…</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
